# Global defaults the editor and all profiles can read
[profile.default]
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@foundry-era-contracts/=lib/foundry-era-contracts/src/system-contracts/contracts/"
]

solc = "0.8.24"
auto_detect_solc = true

[profile.ethereum]
src = "src/ethereum"
out = "out"
test = "test/ethereum"
script= "script"
via-ir = false
solc = "0.8.24"

[profile.zksync]
src = "src/zksync"
test = "test/zksync"
script= "script/zksync"
is-system = true
via-ir = true
optimizer = true
solc = "0.8.24"
zksolc = "1.5.15"