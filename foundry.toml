# Global defaults the editor and all profiles can read
[profile.default]
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@foundry-era-contracts/=lib/foundry-era-contracts/src/system-contracts/contracts/"
]
bytecode_linking = true

[profile.ethereum]
src = "src/ethereum"
out = "out"
test = "test"
script= "script"

[profile.zksync]
src = "src/zksync"
test = "test/zksync"
script= "script/zksync"
is-system = true