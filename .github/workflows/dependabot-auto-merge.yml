name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: dependabot-auto-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      checks: read
      statuses: read
      contents: write
      pull-requests: write
      issues: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          ensure_label() {
            local repo="$1" name="$2" color="$3" description="$4"
            gh_write label create "$name" --repo "$repo" --color "$color" --description "$description" --force
          }
          
          gh_write() {
            if [[ "${DRY_RUN:-0}" == 1 ]]; then
              local IFS=' '
              printf 'would\t%s\n' "$*"
            else
              gh "$@"
            fi
          }
          
          usage() {
            printf 'Usage: automerge.sh <repo> <pr> <update-type> [--wait-seconds N] [--poll-seconds N]\n' >&2
            exit 2
          }
          if [[ $# == 0 && -n ${REPO:-} && -n ${PR:-} ]]; then
            set -- "$REPO" "$PR" "${UPDATE_TYPE:-}"
          fi
          [[ $# -ge 3 ]] || usage
          repo=$1 pr=$2 update_type=$3
          [[ -n "$repo" && -n "$pr" ]] || usage
          shift 3
          wait_seconds=1800 poll_seconds=30
          while [[ $# -gt 0 ]]; do
            [[ $# -ge 2 && $2 =~ ^[0-9]+$ ]] || usage
            case "$1" in
              --wait-seconds) wait_seconds=$((10#$2)) ;;
              --poll-seconds) poll_seconds=$((10#$2)) ;;
              *) usage ;;
            esac
            shift 2
          done
          diagnostic=$(mktemp)
          trap 'rm -f -- "$diagnostic"' EXIT
          write_output=/dev/null
          [[ ${DRY_RUN:-0} != 1 ]] || write_output=/dev/stdout
          
          collapse_error() {
            tr '\t\r\n' '   ' < "$diagnostic" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          
          # Emit the final decision, adding its diagnostic label on a best-effort basis.
          finish() {
            local decision=$1 detail=$2 color failed=0
            if [[ "$decision" != merged ]]; then
              case "$decision" in
                major) color=d93f0b ;;
                no-ci) color=fbca04 ;;
                ci-failed|merge-failed) color=b60205 ;;
                timeout) color=c5def5 ;;
                *) color=ededed ;;
              esac
              # Real gh output is suppressed so stdout contains only the result and dry-run lines.
              ensure_label "$repo" "automerge/$decision" "$color" "Auto-merge decision: $decision" > "$write_output" 2> "$diagnostic" || failed=1
              gh_write pr edit "$pr" --repo "$repo" --add-label "automerge/$decision" > "$write_output" 2> "$diagnostic" || failed=1
              [[ $failed == 0 ]] || detail+='; label failed'
            fi
            printf 'automerge\t%s#%s\t%s\t%s\n' "$repo" "$pr" "$decision" "$detail"
            exit 0
          }
          
          head=$(gh pr view "$pr" --repo "$repo" --json headRefOid --jq .headRefOid 2> "$diagnostic") || finish merge-failed "$(collapse_error)"
          [[ -n $head ]] || finish merge-failed 'missing head commit'
          author=$(gh pr view "$pr" --repo "$repo" --json author --jq .author.login 2> "$diagnostic") || author=$(collapse_error)
          case "$author" in
            app/dependabot|'dependabot[bot]') ;;
            *) finish not-dependabot "$author" ;;
          esac
          case "$update_type" in
            version-update:semver-major) finish major - ;;
            version-update:semver-patch|version-update:semver-minor) ;;
            *) finish unknown-type "${update_type:-empty}" ;;
          esac
          
          started=$SECONDS
          empty_seen=0
          while :; do
            status=0
            checks=$(gh pr checks "$pr" --repo "$repo" --json name,workflow,bucket 2> "$diagnostic") || status=$?
            if jq -e 'type == "array"' > /dev/null 2>&1 <<< "$checks"; then
              checks=$(jq '[.[] | select(.workflow != "Dependabot auto-merge")]' <<< "$checks")
            elif [[ $status == 1 ]] && grep -q 'no checks reported' "$diagnostic"; then
              checks='[]'
            else
              empty_seen=0
              detail=$(collapse_error)
              detail=${detail:-exit $status}
              if (( SECONDS - started >= wait_seconds )); then finish timeout "$detail"; fi
              sleep "$poll_seconds"
              continue
            fi
            failed=$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(",")' <<< "$checks")
            [[ -z "$failed" ]] || finish ci-failed "$failed"
            count=$(jq length <<< "$checks")
            if [[ $count == 0 ]]; then
              if (( empty_seen )); then finish no-ci -; fi
              empty_seen=1
            else
              empty_seen=0
              pending=$(jq -r '[.[] | select(.bucket != "pass" and .bucket != "skipping") | .name] | join(",")' <<< "$checks")
              [[ -n "$pending" ]] || break
              if (( SECONDS - started >= wait_seconds )); then finish timeout "$pending"; fi
            fi
            sleep "$poll_seconds"
          done
          status=0
          gh_write pr merge "$pr" --repo "$repo" --squash --delete-branch --match-head-commit "$head" > "$write_output" 2> "$diagnostic" || status=$?
          if [[ $status != 0 ]]; then
            detail=$(collapse_error)
            finish merge-failed "${detail:-exit $status}"
          fi
          finish merged -
